<z-card [zTitle]="post().title" [zDescription]="'Post #' + post().id" class="h-full hover:shadow-lg transition-shadow">

    <div class="flex flex-col h-full justify-between gap-4">
        <p class="text-sm text-muted-foreground leading-relaxed">
            {{ post().body }}
        </p>

        <div class="pt-4">
            <button z-button zType="outline" [routerLink]="['/post', post().id]"><i z-icon zType="eye"></i>
                Read more
            </button>
        </div>
    </div>
</z-card>
